<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Finance, risk and data</title>
  <desc id="desc">An editorial banner with a burgundy accent, slate grid and an abstract market line. The line is decorative and does not represent financial data.</desc>
  <style>
    .paper { fill: #F8F7F4; }
    .ink { fill: #64748B; }
    .muted { fill: #94A3B8; }
    .accent { fill: #722F37; }
    .grid { stroke: #94A3B8; opacity: .19; }
    .line { stroke: #722F37; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #161B22; }
      .ink { fill: #F8F7F4; }
      .line { stroke: #94A3B8; }
    }
  </style>
  <rect class="paper" width="1200" height="230" rx="4"/>
  <rect class="accent" width="6" height="230"/>
  <g class="grid" fill="none" stroke-width="1">
    <path d="M680 40V190 M780 40V190 M880 40V190 M980 40V190 M1080 40V190"/>
    <path d="M640 55H1150 M640 95H1150 M640 135H1150 M640 175H1150"/>
  </g>
  <text x="48" y="65" class="muted" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3">AN ANALYTICAL PERSPECTIVE</text>
  <text x="46" y="117" class="ink" font-family="Georgia, 'Times New Roman', serif" font-size="40">Finance, risk &amp; data.</text>
  <path d="M48 146H115" stroke="#722F37" stroke-width="3"/>
  <text x="48" y="182" class="ink" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1">MARKETS / INFRASTRUCTURE / OVERSIGHT</text>
  <path class="line" d="M640 166L685 154L730 161L775 125L820 140L865 114L910 122L955 76L1000 99L1045 69L1090 82L1150 46" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="955" cy="76" r="5" class="accent"/>
  <circle cx="1150" cy="46" r="4" class="muted"/>
  <text x="1150" y="210" text-anchor="end" class="muted" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">POLINA MARUNYAK</text>
</svg>
